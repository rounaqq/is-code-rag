name: IS 456 Structural RAG CI/CD Pipeline

'on':
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Regression Tests & Evaluation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The raw corpus is DVC-tracked and deliberately not committed, and the default
      # remote is a local directory that does not exist on a runner. Set the repository
      # variable DVC_REMOTE_URL (plus the storage credentials as secrets) to restore it;
      # otherwise the corpus integrity checks report as skipped rather than passed.
      - name: Pull DVC-tracked corpus
        env:
          DVC_REMOTE_URL: ${{ vars.DVC_REMOTE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$DVC_REMOTE_URL" ]; then
            echo "::notice title=Corpus not restored::DVC_REMOTE_URL is not configured, so the raw PDFs cannot be pulled. Corpus integrity tests will report as skipped."
            exit 0
          fi
          dvc remote add -d ci "$DVC_REMOTE_URL" --local
          dvc pull --verbose

      - name: Verify Chunk Index Integrity
        run: |
          python -m src.chunking.build_chunks

      - name: Run Test Suite
        env:
          PYTHONPATH: "."
          IS_RAG_API_KEYS: "test_ci_client:FAKE_CI_KEY_FOR_TESTING_ONLY"
        run: |
          python -m pytest tests/ -v

      - name: Run Step 9 Master Evaluation Benchmark
        env:
          PYTHONPATH: "."
        run: |
          python -m src.evaluation.run_step9_master_eval

      - name: Archive Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step9-master-evaluation-reports
          path: |
            data/eval/step9_master_evaluation_report.json
            data/eval/sp16_evaluation_report.json
            data/eval/design_evaluation_report.json
            data/eval/engineer_review_package.json
          retention-days: 14

  docker-build:
    name: Docker Image Build, Tag & Publish
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests only build. Pushes to a branch publish sha-<short> and, on the
          # default branch, latest - the tag the Kubernetes Deployment consumes.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
