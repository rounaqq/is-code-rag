# Secret template. The values below are placeholders and MUST be replaced before apply:
#   kubectl -n is-rag create secret generic is-rag-secrets \
#     --from-literal=IS_RAG_API_KEYS='engineer_name:real_key' \
#     --from-literal=POSTGRES_USER='rag_user' \
#     --from-literal=POSTGRES_PASSWORD='<real password>' \
#     --from-literal=OLLAMA_API_TOKEN='<real token or empty>' \
#     --dry-run=client -o yaml | kubectl apply -f -
# Never commit real keys here. tests/test_kubernetes_manifests.py asserts these stay placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: is-rag-secrets
  namespace: is-rag
  labels:
    app.kubernetes.io/name: is-rag
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Comma-separated "name:key" pairs, same format as the local .env file.
  IS_RAG_API_KEYS: "REPLACE_ME_engineer:REPLACE_ME_API_KEY"
  POSTGRES_USER: "rag_user"
  POSTGRES_PASSWORD: "REPLACE_ME_DB_PASSWORD"
  # Only needed when the LLM detailing proposal endpoint is exercised.
  OLLAMA_API_TOKEN: ""
