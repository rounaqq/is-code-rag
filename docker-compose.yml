# Step 10: Docker Compose Configuration for IS 456 Structural RAG Service
services:
  postgres:
    image: postgres:15-alpine
    container_name: is456-rag-postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: is_codes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d is_codes_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  is456-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: is456-rag-api
    ports:
      - "8000:8000"
    environment:
      - IS_RAG_API_KEYS=${IS_RAG_API_KEYS:-test_engineer:FAKE_DEMO_KEY_FOR_LOCAL_TESTING_ONLY,prod_client:FAKE_PROD_KEY_FOR_LOCAL_TESTING_ONLY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_TOKEN=${OLLAMA_API_TOKEN:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/audit:/app/data/audit
      - ./data/processed/cad:/app/data/processed/cad
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
